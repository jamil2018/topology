name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://topology:topology@127.0.0.1:54329/topology
      AUTH_SECRET: topology-ci-secret-not-for-production
      AUTH_URL: http://127.0.0.1:4317
      TOPOLOGY_ISSUE_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # High and critical advisories are reported and must be triaged.
      # continue-on-error is only on this step: npm audit --audit-level=high
      # already exits 1 on pre-existing findings, and those must not fail the
      # release gate. Exit 1 is an advisory report. Any other status is a
      # command or script error and fails the job in the next step.
      - name: npm audit
        id: npm-audit
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev --audit-level=high | tee "$RUNNER_TEMP/npm-audit.txt"
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            {
              echo "## npm audit"
              echo
              echo "High and critical advisories are reported and must be triaged."
              echo
              echo '```'
              cat "$RUNNER_TEMP/npm-audit.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Fail on npm audit command errors
        if: steps.npm-audit.outcome == 'failure' && steps.npm-audit.outputs.status != '1'
        run: |
          echo "npm audit exited ${{ steps.npm-audit.outputs.status }}."
          echo "Advisory reports exit 1 and are triaged from the job summary. Any other status is a command or script error."
          exit 1
      - run: npm run build
      - name: Client bundle secret scan
        run: |
          if [ ! -d .next ]; then
            echo ".next was not produced; skipping client bundle secret scan."
            exit 0
          fi
          if [ ! -d .next/static ]; then
            echo ".next/static is absent; skipping client bundle secret scan."
            exit 0
          fi
          pattern='(^|[^A-Za-z0-9_])(JIRA_API_TOKEN|AUTH_GITHUB_SECRET|LINEAR_API_KEY|GITLAB_TOKEN)["'\'']?[[:space:]]*[:=]'
          set +e
          grep -R -n -E --binary-files=text "$pattern" .next/static
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Client bundle assigns a secret env name."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "Bundle secret scan failed (grep status $status)."
            exit "$status"
          fi
          echo "No assigned secret env names in .next/static."

  unit:
    name: Unit + UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:ui

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topology
          POSTGRES_PASSWORD: topology
          POSTGRES_DB: topology
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U topology -d topology"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://topology:topology@127.0.0.1:54329/topology
      AUTH_SECRET: topology-ci-secret-not-for-production
      AUTH_URL: http://127.0.0.1:4317
      DEMO_USER_EMAIL: demo@topology.local
      DEMO_USER_PASSWORD: topology-demo
      TOPOLOGY_API_TOKEN: topo_demo_token_local_dev_only
      TOPOLOGY_URL: http://127.0.0.1:4317
      TOPOLOGY_ISSUE_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # db:seed uses tsx --env-file=.env.local; CI env already supplies vars
      - run: touch .env.local
      - run: npm run db:migrate
      - run: npm run db:seed
      # RBAC throws without the e2e users. api-security runs that file after db:seed:e2e.
      - run: npm run test:integration -- --exclude "**/rbac.integration.test.ts"

  api-security:
    name: API security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topology
          POSTGRES_PASSWORD: topology
          POSTGRES_DB: topology
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U topology -d topology"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://topology:topology@127.0.0.1:54329/topology
      AUTH_SECRET: topology-ci-secret-not-for-production
      AUTH_URL: http://127.0.0.1:4317
      DEMO_USER_EMAIL: demo@topology.local
      DEMO_USER_PASSWORD: topology-demo
      TOPOLOGY_API_TOKEN: topo_demo_token_local_dev_only
      TOPOLOGY_URL: http://127.0.0.1:4317
      TOPOLOGY_ISSUE_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: touch .env.local
      - run: npm run db:migrate
      - run: npm run db:seed:e2e
      - name: RBAC, security, webhook, CLI, and MCP tests
        run: |
          npx vitest run --config vitest.integration.config.ts \
            tests/integration/rbac.integration.test.ts \
            tests/integration/security.integration.test.ts \
            tests/integration/security/unauth-sweep.integration.test.ts \
            tests/integration/webhooks.integration.test.ts \
            tests/integration/cli-ingest.integration.test.ts \
            tests/integration/mcp-scopes.integration.test.ts \
            tests/integration/issues-mcp.integration.test.ts

  e2e:
    name: Playwright desktop
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topology
          POSTGRES_PASSWORD: topology
          POSTGRES_DB: topology
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U topology -d topology"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://topology:topology@127.0.0.1:54329/topology
      AUTH_SECRET: topology-ci-secret-not-for-production
      AUTH_URL: http://127.0.0.1:4317
      DEMO_USER_EMAIL: demo@topology.local
      DEMO_USER_PASSWORD: topology-demo
      TOPOLOGY_API_TOKEN: topo_demo_token_local_dev_only
      TOPOLOGY_URL: http://127.0.0.1:4317
      TOPOLOGY_ISSUE_PROVIDER: mock
      CI: true
      PORT: "4317"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: touch .env.local
      - run: npm run db:migrate
      - run: npm run db:seed:e2e
      - name: Playwright setup and desktop-1440
        run: npx playwright test --project=setup --project=desktop-1440 --reporter=dot --reporter=html
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4317
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-desktop
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e-viewport:
    name: Playwright viewports
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: topology
          POSTGRES_PASSWORD: topology
          POSTGRES_DB: topology
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U topology -d topology"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://topology:topology@127.0.0.1:54329/topology
      AUTH_SECRET: topology-ci-secret-not-for-production
      AUTH_URL: http://127.0.0.1:4317
      DEMO_USER_EMAIL: demo@topology.local
      DEMO_USER_PASSWORD: topology-demo
      TOPOLOGY_API_TOKEN: topo_demo_token_local_dev_only
      TOPOLOGY_URL: http://127.0.0.1:4317
      TOPOLOGY_ISSUE_PROVIDER: mock
      CI: true
      PORT: "4317"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: touch .env.local
      - run: npm run db:migrate
      - run: npm run db:seed:e2e
      - name: Playwright viewport and a11y shard
        run: |
          npx playwright test \
            --project=setup \
            --project=mobile-390 \
            --project=tablet-834 \
            --project=tablet-1194 \
            --project=laptop-1366 \
            --project=desktop-1920 \
            --shard=${{ matrix.shard }}/2 \
            --reporter=dot \
            --reporter=html
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4317
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-viewport-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - typecheck
      - build
      - unit
      - integration
      - api-security
      - e2e
      - e2e-viewport
    steps:
      - name: Require every gate job
        run: |
          fail=0
          check() {
            name="$1"
            result="$2"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              fail=1
            fi
          }
          check lint "${{ needs.lint.result }}"
          check typecheck "${{ needs.typecheck.result }}"
          check build "${{ needs.build.result }}"
          check unit "${{ needs.unit.result }}"
          check integration "${{ needs.integration.result }}"
          check api-security "${{ needs.api-security.result }}"
          check e2e "${{ needs.e2e.result }}"
          check e2e-viewport "${{ needs.e2e-viewport.result }}"
          exit "$fail"
