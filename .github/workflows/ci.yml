name: Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * 1"
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run test:inventory -- --check
      - run: npm run packages:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-inventory
          path: |
            tasks/validation/
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python3 -m pip install pytest
      - run: npx playwright install --with-deps chromium
      - run: npm run test:regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence
          path: |
            test-results/
            playwright-report/
            tasks/validation/
          retention-days: 14
  cross-browser-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
  release-evaluation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python3 -m pip install pytest
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            test-results/
            playwright-report/
            tasks/validation/
          retention-days: 30
  release-gate:
    name: Release gate
    if: always()
    needs: [checks, regression, cross-browser-core, release-evaluation]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected evaluations
        env:
          CHECKS: ${{ needs.checks.result }}
          REGRESSION: ${{ needs.regression.result }}
          CORE: ${{ needs.cross-browser-core.result }}
          RELEASE: ${{ needs.release-evaluation.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$CHECKS" = success
          test "$REGRESSION" = success
          test "$CORE" = success
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            test "$RELEASE" = success
          fi
