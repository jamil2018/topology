services:
  postgres:
    image: postgres:16-alpine
    container_name: topology-postgres
    restart: unless-stopped
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: topology
      POSTGRES_PASSWORD: topology
      POSTGRES_DB: topology
    volumes:
      - topology_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topology -d topology"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  topology_pgdata:
